const KEY='codex.mk.v2';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const DEF={onb:0,notice:1,done:{},seen:{},rev:{},stat:{},ex:{},days:[],solved:0,ok:0,fs:'m',hc:0,hide:1,last:null};
let S=JSON.parse(JSON.stringify(DEF));
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function touchDay(){const t=today();if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-60);save()}}
function streak(){let n=0,d=today();if(!S.days.includes(d))d=addDays(d,-1);while(S.days.includes(d)){n++;d=addDays(d,-1)}return n}
function dueList(day){return Object.keys(S.rev).filter(k=>ITEMS[k]&&S.rev[k].due<=day)}
function dueOn(day){return Object.keys(S.rev).filter(k=>ITEMS[k]&&S.rev[k].due===day).length}
function record(id,ok){
  touchDay();S.solved++;if(ok)S.ok++;
  const u=unitOf(id);if(u){S.stat[u]=S.stat[u]||{a:0,c:0};S.stat[u].a++;if(ok)S.stat[u].c++}
  if(!ok)S.rev[id]={due:today(),lv:0};
  save();
}
function reviewed(id,ok){
  const r=S.rev[id];if(!r)return;
  if(ok){r.lv++;if(r.lv>=4)delete S.rev[id];else r.due=addDays(today(),[1,3,7][r.lv-1])}
  else{r.lv=0;r.due=addDays(today(),1)}
  save();
}

}
function drawTabs(){

/* ═════════ 반짝임 · 토스트 ═════════ */
function sparkle(el,n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!el)return;
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const C=['#56726f','#8fa8a4','#c9a227','#e6c55a','#3d5956','#d6e2df'];
  for(let i=0;i<(n||16);i++){
    const s=document.createElement('i');s.className='spk';
    const a=Math.random()*Math.PI*2,d=55+Math.random()*80;
    s.style.cssText=`left:${cx-8}px;top:${cy-8}px;--c:${C[i%6]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;animation:fly ${.65+Math.random()*.4}s cubic-bezier(.2,.7,.3,1) forwards`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),1200);
  }
}
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

function oxBox(it,mode,label,deep){

function unitProg(u){const n=u.concepts.filter(c=>S.done[c.id]).length;return [n,u.concepts.length]}
function acc(uid){const s=S.stat[uid];return s&&s.a?Math.round(s.c/s.a*100):null}
function weakest(){

  if(s.i>=s.ids.length){
    const p=Math.round(s.ok/s.ids.length*100);
    return `<div class="card res"><div class="big">${s.ok} / ${s.ids.length}</div><p>${p===100?'전부 맞혔어요. 선지 함정을 다 피했어요.':p>=70?'거의 다 왔어요. 틀린 건 복습에 들어갔어요.':'괜찮아요. 틀린 선지의 강의부터 다시 보고 오면 확 달라져요.'}</p>
     <div class="duo"><button class="btn line" data-endsess="1">닫기</button><button class="btn" data-tab="review">복습 보기</button></div></div>`;
  }
  const it=ITEMS[s.ids[s.i]];
  return `<div class="backbar"><button class="round" data-endsess="1" aria-label="그만하기">${I.back}</button><div class="t"><b>${s.label}</b><span>틀리면 복습에 들어가요</span></div></div>
  <div class="prog"><span>${s.i+1} / ${s.ids.length}</span><div class="bar"><i style="width:${s.i/s.ids.length*100}%"></i></div><span>${s.ok}개 맞음</span></div>
  ${it.exam?examStub(it):oxBox(it,'sess',it.src)}
  <div id="nextw" style="margin-top:18px"></div>`;
}
function examStub(it){return `<div class="card"><b>${it.src}</b><p class="sub" style="margin:6px 0 18px">실전 문제는 지문이 있어서 문제 화면에서 다시 풀어요.</p><button class="btn sm" data-exam="${EXAMS.findIndex(e=>e.no===it.exam)}" data-fromrev="1">문제 열기</button></div>`}


/* ═════════ 코치 ═════════ */
function vCoach(){
  const rate=S.solved?Math.round(S.ok/S.solved*100):0;
  const times=EXAMS.map(e=>S.ex[e.no]).filter(r=>r&&r.locked).map(r=>r.t);
  const avg=times.length?Math.round(times.reduce((a,b)=>a+b,0)/times.length):0;
  const w=weakest();
  const rows=UNITS.map(u=>{const a=acc(u.id),s=S.stat[u.id];return `<div class="r"><span>${u.title}</span><div class="bar"><i class="${a===null?'':a<50?'low':a<80?'mid':''}" style="width:${a||0}%"></i></div><em>${a===null?'—':a+'%'}</em></div>`}).join('');
  return `${pageHead('코치','푼 기록을 보고 어디부터 다시 볼지 알려 줘요.')}
  <div class="stat3"><div class="tile"><b>${S.solved}</b><span>푼 문항</span></div><div class="tile"><b>${S.solved?rate+'%':'—'}</b><span>정답률</span></div><div class="tile"><b>${times.length?fmt(avg):'—'}</b><span>기출 평균 시간</span></div></div>
  <h2 class="sec">지금 해야 할 것</h2>
  ${coachAdvice(w,avg,times.length)}
  <h2 class="sec">단원별 정답률</h2>
  <div class="card"><div class="acc">${rows}</div><p class="sub" style="margin-top:18px">3문항 이상 푼 단원부터 판단해요. 빨간 막대는 50% 미만이에요.</p></div>`;
}
function coachAdvice(w,avg,n){
  const out=[];
  if(!S.solved)out.push([I.book,'아직 기록이 없어요','1단원 1강부터 시작해 보세요. 확인 문제를 풀수록 여기 분석이 정확해져요.',`<button class="btn sm" data-open="0:0">1강 시작하기</button>`]);
  if(w&&w.a<80){const ui=UNITS.indexOf(w.u);out.push([I.target,`${w.u.title} — 정답률 ${w.a}%`,w.u.advice,`<div class="two"><button class="btn sm line" data-open="${ui}:0">강의 다시</button><button class="btn sm" data-unitox="${w.u.id}">이 단원 변형 OX</button></div>`])}
  const due=dueList(today()).length;
  if(due)out.push([I.repeat,`오늘 복습 ${due}개`,'틀린 건 잊기 직전에 다시 보는 게 제일 효율적이에요. 하루 이틀 미루면 처음부터 다시 외우는 거랑 비슷해져요.',`<button class="btn sm" data-review="1">복습 시작</button>`]);
  if(n&&avg>150)out.push([I.clock,`기출 평균 ${fmt(avg)}`,'한 문제 2분 30초가 넘어요. 지문을 다 읽기 전에 밑줄 단어와 현대어 풀이부터 맞대 보세요. 대부분 그 단계에서 답이 갈려요.','']);
  if(!out.length)out.push([I.spark||I.target,'흔들리는 단원이 없어요','실전 기출을 시간 재고 다시 풀어 보세요. 1분 안에 정답과 근거를 말할 수 있으면 완벽해요.',`<button class="btn sm" data-jump="exam">실전 기출</button>`]);
  return out.map(([ic,t,p,b])=>`<div class="advice" style="margin-bottom:12px"><span class="ic">${ic}</span><div style="flex:1"><b>${t}</b><p>${p}</p>${b?`<div style="height:14px"></div>${b}`:''}</div></div>`).join('');
}

/* ═════════ 복습 (Qnote) ═════════ */
function vReview(){
  const t=today(),due=dueList(t);
  const all=Object.keys(S.rev).filter(k=>ITEMS[k]);
  return `${pageHead('복습','잊을 때쯤 다시 나와요')}
  <div class="today"><small>오늘 복습</small><b>${due.length}개</b><span>${due.length?'세 번 연속 맞히면 졸업해요':'오늘은 다 했어요'}</span></div>
  ${due.length?`<div style="height:18px"></div><button class="btn" data-review="1">오늘 복습 시작</button>`:''}
  <div class="nextrev"><b>다음 복습</b><div class="r"><span>내일</span><b>${dueOn(addDays(t,1))}개</b></div><div class="r"><span>모레</span><b>${dueOn(addDays(t,2))}개</b></div></div>
  <h2 class="sec">복습 목록 ${all.length}개</h2>
  ${all.length?all.map(k=>{const it=ITEMS[k],r=S.rev[k];return `<div class="ritem"><div class="s">${it.src} · ${r.due<=t?'오늘':r.due.slice(5).replace('-','/')}</div><div class="q">${f(it.q)}</div><div style="height:8px"></div><button class="link" data-goc="${it.link}">개념 보기 ${I.next}</button></div>`}).join(''):`<div class="empty"><b>아직 틀린 문제가 없어요</b><p>확인 문제, 선지 OX, 실전 기출에서 틀리면 여기에 모여요.</p></div>`}`;
}

/* ═════════ 더보기 (Qnote 설정) ═════════ */
function vMore(){
  return `${pageHead('더보기','화면과 기록을 관리해요.')}
  <div class="card setcard"><h3>보기</h3>
   <div class="preview"><b>미리보기</b><span>이 카드처럼 글자 크기·대비가 적용돼요. <span class="mk">ᄒᆞ쇼셔</span> <span class="mk">듣ᄌᆞᄫᆞ며</span></span></div>
   <p class="lab">글자 크기</p>
   ${seg('fs',[['m','보통'],['l','크게'],['xl','더 크게']],S.fs)}
   <div class="tg"><div class="t"><b>고대비 모드</b><span>글자와 테두리를 더 또렷하게 표시해요.</span></div><button class="sw ${S.hc?'on':''}" data-sw="hc" aria-label="고대비 모드"></button></div>
  </div>
  <div class="card setcard"><h3>화면 표시</h3>
   <div class="tg" style="margin-top:0"><div class="t"><b>스크롤 시 상·하단 바 숨기기</b><span>아래로 스크롤하면 상단바와 하단 탭이 사라져 화면을 넓게 쓰고, 위로 올리면 다시 나타나요.</span></div><button class="sw ${S.hide?'on':''}" data-sw="hide" aria-label="바 숨기기"></button></div>
  </div>
  <h2 class="sec">설정</h2>
  <div class="sgrid">
   <button class="sbtn" data-reonb="1">${I.book}<span>사용법 다시 보기</span></button>
   <button class="sbtn" data-notice="1">${I.bulb}<span>안내 박스 다시 켜기</span></button>
   <button class="sbtn" data-resetrev="1">${I.repeat}<span>복습 목록 비우기</span></button>
   <button class="sbtn danger" data-reset="1">${I.trash}<span>기록 모두 지우기</span></button>
  </div>
  <div class="foot"><span>개념 ${Object.keys(S.done).length}/${TOTAL}</span><span>푼 문항 ${S.solved}</span><span>연속 ${streak()}일</span></div>
  <p class="sub" style="text-align:center;margin-top:10px">옛한글이 네모로 보이면 기기 글꼴이 옛한글을 지원하지 않는 거예요. 최신 크롬·삼성 인터넷에서 보세요.</p>`;
}

/* ═════════ 채점 ═════════ */
function answerOX(box,btn){
  if(box.dataset.lock)return;box.dataset.lock=1;
  const it=ITEMS[box.dataset.id],pick=btn.dataset.ans==='1',ok=pick===it.a,mode=box.dataset.mode;
  box.dataset.ok=ok?'1':'0';
  box.querySelectorAll('.oxb button').forEach(b=>{b.disabled=true;if((b.dataset.ans==='1')===it.a)b.classList.add('r');else if(b===btn)b.classList.add('w')});
  if(ok)sparkle(btn);else{box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake')}
  if(R.sess&&R.sess.kind==='review')reviewed(it.id,ok);
  record(it.id,ok);
  if(R.sess&&R.sess.kind==='review'&&!ok)S.rev[it.id]={due:addDays(today(),1),lv:0},save();
  const showLink=mode==='sess';
  box.querySelector('.fbw').innerHTML=`<div class="fb ${ok?'ok':'no'}"><strong>${ok?'맞았어요':'아쉬워요'} · 정답 ${it.a?'O':'X'}</strong>${f(it.why)}${showLink?`<div style="height:8px"></div><button class="link" data-goc="${it.link}">관련 강의 보기 ${I.next}</button>`:''}</div>`;
  if(mode==='basic')afterBasic(UNITS[R.unit].concepts[R.ci]);
  if(mode==='deep')afterDeep(UNITS[R.unit].concepts[R.ci]);
  if(mode==='sess'){if(ok)R.sess.ok++;document.getElementById('nextw').innerHTML=`<button class="btn" data-nextq="1">${R.sess.i+1<R.sess.ids.length?'다음 문제':'결과 보기'}</button>`}
  drawTop();
}
function pickExam(n){
  const e=EXAMS[R.exam];if(S.ex[e.no]?.locked)return;
  const t=Math.floor((Date.now()-tStart)/1000);stopTimer();
  const ok=n===e.ans;
  S.ex[e.no]={locked:1,pick:n,ok:ok?1:0,t};
  const id='e:'+e.no;
  if(S.rev[id])reviewed(id,ok);
  record(id,ok);
  if(!ok)S.rev[id]={due:today(),lv:0},save();
  render('u');
  const target=app.querySelector(ok?'.ch.right':'.ch.wrong');
  if(target){target.scrollIntoView({block:'center',behavior:'smooth'});if(ok)setTimeout(()=>sparkle(target,24),250);else target.classList.add('shake')}
}

/* ═════════ 이벤트 ═════════ */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.ans!==undefined){answerOX(t.closest('.ox'),t);return}
  if(d.onb){if(d.onb==='next'){if(R.onb<2){R.onb++;render('')}else{S.onb=1;save();go({tab:'home'},'u')}}else if(R.onb>0){R.onb--;render('l')}return}
  if(d.tab){R.sess=null;R.exam=null;if(d.tab==='units'&&R.seg==='lesson')R.seg='concept';go({tab:d.tab});return}
  if(d.open){const [u,c]=d.open.split(':').map(Number);R.sess=null;go({tab:'units',seg:'lesson',unit:u,ci:c,exam:null},'');return}
  if(d.goc){const p=CON[d.goc];if(p){R.sess=null;go({tab:'units',seg:'lesson',unit:p.u,ci:p.c,exam:null},'')}return}
  if(d.step!==undefined){const n=+d.step,back=n<R.ci;R.ci=n;render(back?'l':'');window.scrollTo({top:0});return}
  if(d.seg){const [name,val]=d.seg.split(':');
    if(name==='useg'){R.exam=null;R.sess=null;stopTimer();const order=['concept','exam','ox'];const back=order.indexOf(val)<order.indexOf(R.seg);go({tab:'units',seg:val},back?'l':'')}
    if(name==='fs'){S.fs=val;save();applySettings();render('u')}
    return}
  if(d.jump){R.sess=null;R.exam=null;go({tab:'units',seg:d.jump},'');return}
  if(d.exam!==undefined){const i=+d.exam;if(d.fromrev){const no=EXAMS[i].no;delete S.ex[no];save();R.sess=null}go({tab:'units',seg:'exam',exam:i},'');return}
  if(d.fullpass){const box=t.nextElementSibling;if(box.innerHTML){box.innerHTML='';t.lastChild.textContent=' 전체 지문 보기'}else{const no=+d.fullpass;const e=EXAMS.find(x=>x.no===no);box.innerHTML=no===10?PASS10:(e?e.pass:'');t.lastChild.textContent=' 지문 접기'}return}
  if(d.pick){pickExam(+d.pick);return}
  if(d.retry){delete S.ex[+d.retry];save();render('u');return}
  if(d.variant){const e=EXAMS.find(x=>x.no===+d.variant);const ids=[];[...new Set(e.links)].forEach(cid=>{const c=UNITS[CON[cid].u].concepts[CON[cid].c];c.basic.forEach((_,i)=>ids.push('b:'+cid+':'+i));c.deep.forEach((_,i)=>ids.push('p:'+cid+':'+i))});R.exam=null;stopTimer();startSess(ids.sort(()=>Math.random()-.5),e.no+'번 변형 OX','ox');return}
  if(d.filter){R.filter=d.filter;render('u');return}
  if(d.start){let ids=oxIds();if(d.start==='shuffle')ids=ids.slice().sort(()=>Math.random()-.5);startSess(ids,R.filter==='전체'?'선지 OX':R.filter+' 선지','ox');return}
  if(d.nextq){R.sess.i++;render('');window.scrollTo({top:0});return}
  if(d.endsess){R.sess=null;render('l');return}
  if(d.review){const ids=dueList(today());R.tab='review';startSess(ids,'오늘 복습','review');return}
  if(d.unitox){const u=UNITS.find(x=>x.id===d.unitox);const ids=[];u.concepts.forEach(c=>{c.basic.forEach((_,i)=>ids.push('b:'+c.id+':'+i));c.deep.forEach((_,i)=>ids.push('p:'+c.id+':'+i))});DRILL.forEach(x=>{if(CON[x.link]&&CON[x.link].unit===u.id)ids.push(x.id)});startSess(ids.sort(()=>Math.random()-.5),u.title+' 변형 OX','ox');return}
  if(d.notice!==undefined){S.notice=+d.notice;save();if(R.tab==='more')toast('홈에 안내 박스를 다시 띄웠어요');render('u');return}
  if(d.sw){S[d.sw]=S[d.sw]?0:1;save();applySettings();t.classList.toggle('on');if(d.sw==='hide'&&!S.hide)document.body.classList.remove('hide');return}
  if(d.reonb){S.onb=0;R.onb=0;save();render('u');return}
  if(d.resetrev){if(confirm('복습 목록을 비울까요?')){S.rev={};save();render('u');toast('복습 목록을 비웠어요')}return}
  if(d.reset){if(confirm('개념 완료, 푼 기록, 복습 목록을 모두 지울까요?')){const keep={fs:S.fs,hc:S.hc,hide:S.hide,onb:1};S=Object.assign(JSON.parse(JSON.stringify(DEF)),keep);save();render('u');toast('기록을 모두 지웠어요')}return}
  if(d.help){toast(d.help==='unit'?'강의를 끝까지 풀면 개념 완료로 표시돼요':'');return}
  if(t.id==='bell'){const n=dueList(today()).length;toast(n?`오늘 복습 ${n}개가 기다리고 있어요`:'새 알림이 없어요');return}
});

/* 스크롤 시 바 숨기기 */
let lastY=0;
addEventListener('scroll',()=>{
  if(!S.hide)return;const y=scrollY;
  if(y>lastY+8&&y>120)document.body.classList.add('hide');
  else if(y<lastY-8)document.body.classList.remove('hide');
  lastY=y;
},{passive:true});
addEventListener('resize',()=>{placeKnobs();drawTabs()});

touchDay();
render('u');
/* 앱 설치(PWA): GitHub Pages(https)에서만 동작 */
if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
